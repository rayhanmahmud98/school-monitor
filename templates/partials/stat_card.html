<div class="card flex items-center gap-3 p-4 sm:gap-4 sm:p-5">
  <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-{{ color }}-100 text-{{ color }}-600 text-lg sm:h-12 sm:w-12 sm:text-xl">
    <i class="fa-solid {{ icon }}"></i>
  </div>
  <div class="min-w-0">
    <div class="stat-value text-xl font-bold sm:text-2xl">{{ value }}</div>
    <div class="text-xs text-slate-500 sm:text-sm">{{ label }}</div>
  </div>
</div>
