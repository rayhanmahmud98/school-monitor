{% if messages %}
<div class="mb-6 space-y-2">
  {% for message in messages %}
  <div class="flex items-start gap-3 rounded-lg border px-4 py-3 text-sm
    {% if message.tags == 'success' %}border-green-200 bg-green-50 text-green-800
    {% elif message.tags == 'error' %}border-red-200 bg-red-50 text-red-800
    {% elif message.tags == 'warning' %}border-yellow-200 bg-yellow-50 text-yellow-800
    {% else %}border-blue-200 bg-blue-50 text-blue-800{% endif %}">
    <i class="fa-solid mt-0.5 {% if message.tags == 'success' %}fa-circle-check{% elif message.tags == 'error' %}fa-circle-xmark{% elif message.tags == 'warning' %}fa-triangle-exclamation{% else %}fa-circle-info{% endif %}"></i>
    <span>{{ message }}</span>
  </div>
  {% endfor %}
</div>
{% endif %}
