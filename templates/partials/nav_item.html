{% load static %}
<a href="{{ url }}"
   class="flex items-center gap-3 rounded-md px-3 py-2 text-sm font-medium transition-colors
          {% if request.path == url %}bg-slate-800 text-white{% else %}text-slate-300 hover:bg-slate-800 hover:text-white{% endif %}">
  <i class="fa-solid {{ icon }} w-4 shrink-0 text-center"></i>
  <span class="{% if show_label %}inline{% else %}hidden lg:inline{% endif %} truncate">{{ label }}</span>
</a>
