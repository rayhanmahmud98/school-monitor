{% extends base_template %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="card mx-auto mt-10 max-w-lg p-8">
  <h1 class="text-xl font-bold text-red-700"><i class="fa-solid fa-triangle-exclamation mr-2"></i>{{ title }}</h1>
  <p class="mt-3 text-slate-600">Are you sure you want to delete <strong>{{ object }}</strong>? This cannot be undone.</p>
  <form method="post" class="mt-6 flex gap-3">{% csrf_token %}
    <button class="btn-danger">Yes, delete</button>
    <a href="{{ cancel_url }}" class="btn-light">Cancel</a>
  </form>
</div>
{% endblock %}
